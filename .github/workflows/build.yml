name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Post build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request

          log = open("build.log", "r", errors="replace").read()
          log = log[-60000:]

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GITHUB_TOKEN"]

          url = f"https://api.github.com/repos/{repo}/commits/{sha}/comments"
          data = json.dumps({"body": "```\n" + log + "\n```"}).encode()
          req = urllib.request.Request(url, data=data, method="POST")
          req.add_header("Authorization", f"token {token}")
          req.add_header("Accept", "application/vnd.github+json")
          urllib.request.urlopen(req)
          PYEOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release with APK (para el chequeo de actualizaciones in-app)
        if: success() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/tvremote-v${{ github.run_number }}.apk
          gh release create "v${{ github.run_number }}" \
            "app/build/outputs/apk/debug/tvremote-v${{ github.run_number }}.apk" \
            --title "Build ${{ github.run_number }}" \
            --notes "Compilación automática desde ${{ github.sha }}"
